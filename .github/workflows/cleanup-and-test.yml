name: 🧹 Database Duplicate Cleaner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Clean Duplicate Workflows from Database
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          
          echo "Purging duplicate workflows..."
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -c "
            DELETE FROM shared_workflow WHERE \"workflowId\" NOT IN ('xfDYU5yLH26Hbt2C', 'xf5WxpI9B1owkRvt', 'AeflYLlk8Zssd4vG', '0DncsJwuttaZMrSW');
            DELETE FROM workflow_entity WHERE id NOT IN ('xfDYU5yLH26Hbt2C', 'xf5WxpI9B1owkRvt', 'AeflYLlk8Zssd4vG', '0DncsJwuttaZMrSW');
          "
          
          echo "Listing all clean remaining workflows in Cloud Database:"
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -c "
            SELECT id, name, active FROM workflow_entity ORDER BY name;
          "
