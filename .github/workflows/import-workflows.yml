name: 📥 Cloud Workflow Synchronizer & Importer

on:
  workflow_dispatch:
  push:
    paths:
      - 'workflows/**'

permissions:
  contents: write
  actions: write

jobs:
  import-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Import Workflows into Cloud Neon Database
        env:
          DB_TYPE: postgresdb
          DB_POSTGRESDB_HOST: ${{ secrets.DB_HOST }}
          DB_POSTGRESDB_DATABASE: ${{ secrets.DB_NAME }}
          DB_POSTGRESDB_USER: ${{ secrets.DB_USER }}
          DB_POSTGRESDB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_POSTGRESDB_PORT: "5432"
          DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_DEFAULT_BINARY_DATA_MODE: filesystem
        run: |
          echo "Importing all workflows from ./workflows into Neon PostgreSQL..."
          docker run --rm \
            -v $(pwd)/workflows:/workflows \
            -e DB_TYPE="$DB_TYPE" \
            -e DB_POSTGRESDB_HOST="$DB_POSTGRESDB_HOST" \
            -e DB_POSTGRESDB_DATABASE="$DB_POSTGRESDB_DATABASE" \
            -e DB_POSTGRESDB_USER="$DB_POSTGRESDB_USER" \
            -e DB_POSTGRESDB_PASSWORD="$DB_POSTGRESDB_PASSWORD" \
            -e DB_POSTGRESDB_PORT="$DB_POSTGRESDB_PORT" \
            -e DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED="$DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED" \
            -e N8N_ENCRYPTION_KEY="$N8N_ENCRYPTION_KEY" \
            docker.n8n.io/n8nio/n8n:latest \
            n8n import:workflow --separate --input=/workflows

          echo "Listing all workflows in Cloud Neon Database..."
          docker run --rm \
            -e DB_TYPE="$DB_TYPE" \
            -e DB_POSTGRESDB_HOST="$DB_POSTGRESDB_HOST" \
            -e DB_POSTGRESDB_DATABASE="$DB_POSTGRESDB_DATABASE" \
            -e DB_POSTGRESDB_USER="$DB_POSTGRESDB_USER" \
            -e DB_POSTGRESDB_PASSWORD="$DB_POSTGRESDB_PASSWORD" \
            -e DB_POSTGRESDB_PORT="$DB_POSTGRESDB_PORT" \
            -e DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED="$DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED" \
            -e N8N_ENCRYPTION_KEY="$N8N_ENCRYPTION_KEY" \
            docker.n8n.io/n8nio/n8n:latest \
            n8n list:workflow
